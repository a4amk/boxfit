# boxfit workload: single-namespace shape, 200k vectors.
# Mirrors a plain namespace-filtered collection (no corpus layer):
# small, cheap, suitable as a smoke workload for new boxes.
name: single-namespace-200k
target:
  url_env: QDRANT_URL
  api_key_env: QDRANT_API_KEY
collection:
  name: boxfit_ns
  dim: 512
  datatype: uint8
  distance: Cosine
  on_disk_payload: true
  hnsw:
    m: 16
    ef_construct: 128
  payload_indexes:
    - field: namespace
      kind: keyword
      is_tenant: true
dataset:
  vectors: 200000
  tenants: 5
  corpora_per_tenant: 1
  clusters_per_tenant: 2
  seed: 777
filter:
  tenant: { field: namespace, match: value }
  corpus: null
load:
  - rps: 100
    duration: 60s
    ef: 100
    top_k: 10
    corpus_pick: 1
  - rps: 250
    duration: 45s
    ef: 100
    top_k: 10
    corpus_pick: 1
slo:
  p50_ms: 10
  p99_ms: 100
  error_rate: 0.02
  achieved_pct: 99
