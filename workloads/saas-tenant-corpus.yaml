# boxfit workload example: multi-tenant SaaS shape.
# 5M vectors, 500 tenants x 5 corpora, tenant + corpus IN-list filter.
name: saas-tenant-corpus-5M
target:
  url_env: QDRANT_URL
  api_key_env: QDRANT_API_KEY
collection:
  name: boxfit_saas
  dim: 512
  datatype: uint8
  distance: Cosine
  on_disk_payload: true
  hnsw:
    m: 16
    ef_construct: 128
  payload_indexes:
    - field: tenant_id
      kind: keyword
      is_tenant: true
    - field: corpus_id
      kind: keyword
dataset:
  vectors: 5000000
  tenants: 500
  corpora_per_tenant: 5
  clusters_per_tenant: 2
  seed: 20250
filter: # single source of truth: seed, ingest, k6, and gate render from here
  tenant: { field: tenant_id, match: value }
  corpus: { field: corpus_id, match: any }
load:
  - rps: 100
    duration: 60s
    ef: 100
    top_k: 10
    corpus_pick: 2
  - rps: 250
    duration: 120s
    ef: 100
    top_k: 10
    corpus_pick: 2
  - rps: 500
    duration: 60s
    ef: 100
    top_k: 10
    corpus_pick: 2
slo:
  p50_ms: 10
  p99_ms: 100
  error_rate: 0.02
  achieved_pct: 99
